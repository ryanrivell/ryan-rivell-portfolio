<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryan Rivell — Mechanical Engineer</title>
<meta name="description" content="Mechanical engineer specializing in design, tolerance analysis, and electromechanical systems.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   COLOR + TYPE TOKENS — change these to retune the whole site
   ============================================================ */
:root{
  --paper:      #ffffff;
  --mist:       #f4f6fb;   /* pale blue-white section fill */
  --rule:       #dce2f0;   /* hairlines */
  --rule-firm:  #b6c2e2;
  --ink:        #0a1330;   /* body text, near-black navy */
  --ink-soft:   #4b5878;
  --royal:      #12308f;   /* the royal blue */
  --royal-deep: #0a1c5c;
  --royal-tint: #e9edfb;

  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:    "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --pad: clamp(20px, 5vw, 72px);
  --maxw: 1160px;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; display:block; }
a{ color:var(--royal); }
button{ font:inherit; color:inherit; }

:focus-visible{ outline:2px solid var(--royal); outline-offset:3px; border-radius:2px; }

.wrap{ max-width:var(--maxw); margin:0 auto; padding-left:var(--pad); padding-right:var(--pad); }

/* --- shared type -------------------------------------------------- */
.eyebrow{
  font-family:var(--mono); font-size:11.5px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--royal);
}
.eyebrow-muted{ color:var(--ink-soft); }
h1,h2,h3,h4{ font-family:var(--display); font-weight:700; letter-spacing:-.02em; line-height:1.08; margin:0; }
.h-sec{ font-size:clamp(28px,4vw,42px); }
.lead{ font-size:clamp(17px,1.9vw,20px); color:var(--ink-soft); max-width:64ch; }

/* ============================ HEADER ============================== */
.masthead{
  position:sticky; top:0; z-index:60; background:rgba(255,255,255,.93);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--rule);
}
.masthead-in{ display:flex; align-items:center; gap:24px; height:66px;
  max-width:var(--maxw); margin:0 auto; padding-left:var(--pad); padding-right:var(--pad); }
.brand{ display:flex; align-items:baseline; gap:10px; background:none; border:0; padding:0; cursor:pointer; }
.brand b{ font-family:var(--display); font-size:17px; font-weight:800; letter-spacing:.01em; }
.brand span{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; }
.nav{ margin-left:auto; display:flex; align-items:center; gap:4px; }
.nav a{
  font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  text-decoration:none; color:var(--ink-soft); padding:9px 13px; border-radius:3px;
}
.nav a:hover{ color:var(--royal); background:var(--royal-tint); }
.nav a.on{ color:var(--royal); }
.nav a.on::after{ content:""; display:block; height:2px; background:var(--royal); margin-top:5px; }
.nav .cta{
  margin-left:10px; color:#fff; background:var(--royal); padding:10px 16px;
}
.nav .cta:hover{ background:var(--royal-deep); color:#fff; }
.menu-btn{ display:none; margin-left:auto; background:none; border:1px solid var(--rule-firm);
  border-radius:3px; padding:8px 11px; font-family:var(--mono); font-size:12px; letter-spacing:.1em; cursor:pointer; }

@media (max-width:860px){
  .menu-btn{ display:block; }
  .nav{
    position:fixed; inset:66px 0 auto 0; background:#fff; border-bottom:1px solid var(--rule);
    flex-direction:column; align-items:stretch; gap:0; padding:8px var(--pad) 20px; display:none;
  }
  .nav.open{ display:flex; }
  .nav a{ padding:14px 0; border-bottom:1px solid var(--rule); font-size:13px; }
  .nav a.on::after{ display:none; }
  .nav .cta{ margin:14px 0 0; text-align:center; border-bottom:0; }
}

/* ============================ HERO ================================ */
.hero{
  border-bottom:1px solid var(--rule);
  background-color:var(--paper);
  background-image:
    linear-gradient(to right, var(--rule) 1px, transparent 1px),
    linear-gradient(to bottom, var(--rule) 1px, transparent 1px);
  background-size:28px 28px;
  background-position:center top;
  position:relative;
}
.hero::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.94) 55%,#fff);
}
.hero-in{ position:relative; z-index:1; display:grid; grid-template-columns:1.55fr .95fr;
  gap:clamp(28px,5vw,64px); align-items:center; padding-top:clamp(48px,7vw,88px); padding-bottom:clamp(48px,7vw,88px); }
.hero h1{ font-size:clamp(44px,7.4vw,86px); font-weight:800; letter-spacing:-.035em; margin:14px 0 0; }
.hero h1 em{ font-style:normal; color:var(--royal); }
.hero .role{
  font-family:var(--mono); font-size:clamp(12px,1.5vw,14px); letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink); margin-top:16px; padding-top:16px;
  border-top:2px solid var(--royal); display:inline-block;
}
.hero p{ margin:22px 0 0; }
.hero-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }

.btn{
  display:inline-block; font-family:var(--mono); font-size:12.5px; letter-spacing:.1em;
  text-transform:uppercase; text-decoration:none; padding:14px 22px; border-radius:3px;
  border:1px solid var(--royal); cursor:pointer; transition:background .18s, color .18s;
}
.btn-solid{ background:var(--royal); color:#fff; }
.btn-solid:hover{ background:var(--royal-deep); border-color:var(--royal-deep); }
.btn-line{ background:#fff; color:var(--royal); }
.btn-line:hover{ background:var(--royal-tint); }

/* portrait without a stark white picture frame */
.portrait{ position:relative; }
.portrait .frame{
  background:linear-gradient(180deg, #f8faff 0%, #fff 100%);
  border:1px solid rgba(18,48,143,.12);
  box-shadow:0 20px 38px -30px rgba(10,28,92,.55);
  overflow:hidden;
  border-radius:8px;
}
.portrait .frame > *{ aspect-ratio:4/5; object-fit:cover; width:100%; display:block; }
.portrait .tag{
  position:absolute; left:-1px; bottom:-1px; background:var(--royal); color:#fff;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; padding:7px 12px; text-transform:uppercase;
}
@media (max-width:820px){
  .hero-in{ grid-template-columns:1fr; }
  .portrait{ order:-1; max-width:260px; }
}

/* placeholder shown when an image file isn't there yet */
.ph{
  display:flex; align-items:center; justify-content:center; text-align:center;
  background:
    repeating-linear-gradient(45deg,var(--royal-tint) 0 10px,#fff 10px 20px);
  border:1px dashed var(--rule-firm); color:var(--royal-deep);
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:16px; line-height:1.6;
  word-break:break-all;
}

/* ============================ SECTIONS ============================ */
.band{ padding-top:clamp(56px,8vw,96px); padding-bottom:clamp(56px,8vw,96px); }
.band-mist{ background:var(--mist); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
.band-head{ margin-bottom:clamp(28px,4vw,44px); }
.band-head h2{ margin-top:10px; }
.band-head p{ margin:14px 0 0; }

/* stat strip */
.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--rule);
  border:1px solid var(--rule); }
.stats div{ background:#fff; padding:22px 20px; }
.stats b{ display:block; font-family:var(--display); font-size:clamp(24px,3.2vw,34px); font-weight:800; color:var(--royal); letter-spacing:-.02em; }
.stats span{ font-family:var(--mono); font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-soft); }
@media (max-width:700px){ .stats{ grid-template-columns:repeat(2,1fr); } }

/* ============================ PROJECT GRID ======================== */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:clamp(20px,3vw,32px); }
.card{
  display:flex; flex-direction:column; text-align:left; background:#fff; border:1px solid var(--rule);
  padding:0; cursor:pointer; transition:border-color .2s, transform .2s, box-shadow .2s; overflow:hidden;
}
.card:hover{ border-color:var(--royal); transform:translateY(-3px); box-shadow:0 14px 30px -22px rgba(10,28,92,.55); }
.card .thumb{ aspect-ratio:16/10; overflow:hidden; border-bottom:1px solid var(--rule); background:var(--mist); }
.card .thumb > *{ width:100%; height:100%; object-fit:contain; background:var(--mist); transition:transform .4s ease; }
.card:hover .thumb > img{ transform:scale(1.035); }
.card .body{ padding:20px 22px 24px; display:flex; flex-direction:column; gap:10px; flex:1; }
.card h3{ font-size:20px; line-height:1.22; }
.card p{ margin:0; font-size:15.5px; color:var(--ink-soft); }
.card .tools{ margin-top:auto; padding-top:14px; border-top:1px solid var(--rule);
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-soft); }
.card .more{ font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--royal); }

/* ============================ TIMELINE ============================ */
.roles{ display:grid; gap:0; }
.role-item{ display:grid; grid-template-columns:210px 1fr; gap:clamp(20px,4vw,48px);
  padding:clamp(28px,4vw,40px) 0; border-top:1px solid var(--rule); }
.role-item:last-child{ border-bottom:1px solid var(--rule); }
.role-meta .when{ font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--royal); }
.role-meta .where{ margin-top:8px; font-weight:600; }
.role-meta .city{ font-size:14.5px; color:var(--ink-soft); }
.role-body h3{ font-size:clamp(21px,2.6vw,27px); }
.role-body ul{ margin:18px 0 0; padding:0; list-style:none; display:grid; gap:12px; }
.role-body li{ position:relative; padding-left:22px; }
.role-body li::before{ content:""; position:absolute; left:0; top:11px; width:9px; height:1.5px; background:var(--royal); }
@media (max-width:760px){ .role-item{ grid-template-columns:1fr; gap:14px; } }

/* ============================ PROJECT PAGE ======================== */
.backlink{
  display:inline-flex; align-items:center; gap:8px; background:none; border:0; cursor:pointer;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-soft); padding:6px 0;
}
.backlink:hover{ color:var(--royal); }

.proj-head{ padding-top:clamp(28px,4vw,44px); padding-bottom:clamp(30px,4vw,44px); }
.proj-head h1{ font-size:clamp(32px,5.2vw,58px); font-weight:800; margin:16px 0 0; max-width:20ch; }
.proj-head .lead{ margin-top:20px; }

/* the title block — borrowed from an engineering drawing sheet */
.titleblock{
  border:1.5px solid var(--ink); display:grid;
  grid-template-columns:repeat(3,1fr); margin-top:34px; background:#fff;
}
.titleblock div{ border-right:1px solid var(--rule-firm); border-bottom:1px solid var(--rule-firm); padding:12px 14px; }
.titleblock div:nth-child(3n){ border-right:0; }
.titleblock dt{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
.titleblock dd{ margin:6px 0 0; font-size:15px; font-weight:600; line-height:1.35; }
@media (max-width:760px){
  .titleblock{ grid-template-columns:repeat(2,1fr); }
  .titleblock div:nth-child(3n){ border-right:1px solid var(--rule-firm); }
  .titleblock div:nth-child(2n){ border-right:0; }
}

.hero-shot{ border:1px solid var(--rule); margin-bottom:clamp(34px,5vw,54px); }
.hero-shot > *{ width:100%; aspect-ratio:16/9; object-fit:contain; background:var(--mist); }

.proj-cols{ width:100%; }
.project-copy .project-tools{ display:flex; flex-wrap:wrap; gap:8px 16px; margin:24px 0 0; font-size:16px; color:var(--ink-soft); }
.project-tools strong{ color:var(--ink); }
.project-copy p,.project-copy .work-list{ font-family:var(--body); font-size:18px; line-height:1.65; font-weight:400; }
.project-copy h2{ font-family:var(--display); font-size:22px; font-weight:700; }
@media (max-width:860px){ .proj-cols{ grid-template-columns:1fr; } }
.proj-cols h2{ font-size:22px; }

.work-list{ list-style:none; margin:20px 0 0; padding:0; display:grid; gap:16px; counter-reset:w; }
.work-list li{ display:grid; grid-template-columns:34px 1fr; gap:14px; counter-increment:w; }
.work-list li::before{
  content:counter(w,decimal-leading-zero); font-family:var(--mono); font-size:12px;
  color:var(--royal); padding-top:5px; letter-spacing:.06em;
}

/* gallery */
.gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-top:22px; }
.shot{ background:none; border:0; padding:0; cursor:zoom-in; text-align:left; }
.shot .box{ border:1px solid var(--rule); overflow:hidden; background:var(--mist); }
.shot .box > *{ width:100%; aspect-ratio:4/3; object-fit:cover; transition:transform .35s ease; }
.shot:hover .box > img{ transform:scale(1.04); }
.shot:hover .box{ border-color:var(--royal); }
.shot figcaption{ font-family:var(--mono); font-size:11.5px; color:var(--ink-soft); margin-top:9px; line-height:1.5; }

/* lightbox */
.lightbox{ position:fixed; inset:0; z-index:200; background:rgba(10,19,48,.94);
  display:flex; align-items:center; justify-content:center; padding:24px; }
.lightbox[hidden]{ display:none; }
.lightbox img{ max-width:min(1100px,94vw); max-height:82vh; object-fit:contain; border:1px solid rgba(255,255,255,.2); }
.lightbox figcaption{ color:#c9d4f2; font-family:var(--mono); font-size:12px; text-align:center; margin-top:16px; }
.lightbox .close{ position:absolute; top:18px; right:18px; background:none; border:1px solid rgba(255,255,255,.35);
  color:#fff; font-family:var(--mono); font-size:12px; letter-spacing:.1em; padding:9px 14px; cursor:pointer; border-radius:3px; }
.lightbox .close:hover{ background:rgba(255,255,255,.12); }

/* next / prev project */
.pager{ display:flex; justify-content:space-between; gap:16px; border-top:1px solid var(--rule);
  margin-top:clamp(44px,6vw,72px); padding-top:24px; }
.pager button{ background:none; border:0; cursor:pointer; text-align:left; padding:6px 0; max-width:46%; }
.pager button:last-child{ text-align:right; }
.pager span{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); }
.pager b{ display:block; font-family:var(--display); font-size:17px; margin-top:6px; line-height:1.25; }
.pager button:hover b{ color:var(--royal); }

/* ============================ SKILLS / ABOUT ====================== */
.skillset{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1px; background:var(--rule); border:1px solid var(--rule); }
.skillset section{ background:#fff; padding:26px 24px; }
.skillset h3{ font-family:var(--mono); font-size:11.5px; font-weight:600; letter-spacing:.14em;
  text-transform:uppercase; color:var(--royal); }
.skillset ul{ margin:16px 0 0; padding:0; list-style:none; display:grid; gap:9px; font-size:15.5px; color:var(--ink-soft); }

.about-grid{ display:grid; grid-template-columns:1.35fr .8fr; gap:clamp(28px,5vw,64px); align-items:start; }
@media (max-width:820px){ .about-grid{ grid-template-columns:1fr; } }
.about-grid p + p{ margin-top:18px; }
.edu{ border:1px solid var(--rule); padding:26px 24px; background:#fff; }
.edu h3{ font-size:20px; margin-top:10px; }
.edu dl{ margin:20px 0 0; display:grid; gap:14px; }
.edu dt{ font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--ink-soft); }
.edu dd{ margin:4px 0 0; font-size:15.5px; }

.home-details{ display:grid; gap:22px; }
#about,#contact{ scroll-margin-top:86px; }

/* ============================ CONTACT ============================= */
.contact-list{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule); margin-top:34px; }
.contact-list a, .contact-list div{ background:#fff; padding:24px; text-decoration:none; color:var(--ink); display:block; }
.contact-list a:hover{ background:var(--royal-tint); }
.contact-list dt{ font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
.contact-list dd{ margin:8px 0 0; font-size:16.5px; font-weight:600; word-break:break-word; }

/* ============================ FOOTER ============================== */
.foot{ border-top:1px solid var(--rule); padding:34px 0; background:#fff; }
.foot-in{ display:flex; flex-wrap:wrap; gap:14px; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--ink-soft); }
.foot a{ color:var(--ink-soft); text-decoration:none; }
.foot a:hover{ color:var(--royal); }

/* motion */
.rise{ opacity:0; transform:translateY(14px); }
.rise.in{ opacity:1; transform:none; transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.3,1); }
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  .rise,.rise.in{ opacity:1; transform:none; transition:none; }
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

@media print{
  .masthead,.pager,.foot,.hero-actions,.backlink{ display:none !important; }
  .hero::after{ display:none; }
  body{ font-size:11pt; }
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <button class="brand" data-go="home">
      <b>RYAN RIVELL</b><span>Mechanical Engineer</span>
    </button>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">MENU</button>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="foot">
  <div class="wrap foot-in">
    <span id="footLeft"></span>
    <span><a href="#/home/contact" data-go="home/contact">GET IN TOUCH</a></span>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="close" id="lbClose">CLOSE ESC</button>
  <figure style="margin:0">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<script>
/* ================================================================

   To add a picture:
     1. Drop the image file into the "images" folder next to this file.
     2. Point at it here, e.g.  cover: "images/gearbox-cover.jpg"
   Any picture you haven't added yet shows a dashed placeholder that
   tells you the exact filename it's looking for. Nothing breaks.

   To add a project: copy one whole { ... } block inside projects[]
   and change the fields. "slug" must be unique — it becomes the page
   address, like  yoursite.com/#/projects/hoist-gearbox
   ================================================================ */
const SITE = {
  name:     "Ryan Rivell",
  role:     "Mechanical Engineer",

  phone:    "+1 (512) 563-8911",     // delete this line to hide your number
  linkedin: "https://linkedin.com/in/ryan-rivell",

  headshot:   "photos/headshot.png",         // your photo
  resumeFile: "Ryan_Rivell_Resume.pdf",      // put a PDF here to make the button work

  tagline: "Bringing ideas to life through design, analysis, and validation.",

  summary: "Mechanical engineer graduating from UT Arlington in December 2026.  Over two years of experience at Lockheed Martin spanning mechanical design and systems engineering. Experienced in CAD (Creo, SolidWorks, Onshape), GD&T, tolerance analysis, FEA, and mechatronics, and taking hardware from concept through release. Passionate about designing, analyzing, and building mechanical and electromechanical systems.",

  stats: [
    { n:"Dec 2026", k:"B.S. Mechanical Eng." },
    { n:"3.97",  k:"GPA" },
    { n:"10",    k:"Featured projects" },
    { n:"2.5 years", k:"At Lockheed Martin" },
  ],

  /* ---------------- WORK ---------------- */
  experience: [
    {
      title:"Mechanical Design Engineering - College Work Experience Program (CWEP)",
      org:"Lockheed Martin", city:"Grand Prairie, TX",
      when:"Apr 2025 — Present",
      points:[
        "Own mechanical components and assemblies through design, tolerance analysis, engineering documentation, multidisciplinary review, and release.",
        "Design structural components, electronics mounting hardware, fixtures, and test hardware in Creo, accounting for packaging, assembly, manufacturability, structural support, and harness clearance.",
        "Create and release 2D drawings and Model Based Definition (MBD) models, applying GD&T to define functional interfaces and manufacturing requirements.",
        "Develop Root Sum Square and worst-case tolerance stacks to evaluate design changes against existing analyses and verify assembly fit and dimensional compatibility.",
        "Perform virtual fit checks and interference analyses, working directly with manufacturing and machine-shop personnel to resolve integration and producibility issues.",
        "Design and fabricate fixtures, prototypes, mass simulators, and other test hardware using conventional and additive methods.",
        "Built VBA automation for Creo mass-property updates and Excel data synchronization, cutting repetitive data entry and manual error."
      ]
    },
    {
      title:"Systems Engineering - CWEP",
      org:"Lockheed Martin", city:"Grand Prairie, TX",
      when:"Apr 2024 — Apr 2025",
      points:[
        "Contributed to systems architecture modernization by developing and modeling a component library in Cameo Systems Modeler.",

/* image with a graceful "not added yet" placeholder */
function img(src, alt, cls=""){
  if(!src) return `<div class="ph ${cls}">No image yet</div>`;
  const safeAlt = String(alt||"").replace(/"/g,"&quot;");
  return `<img src="${src}" alt="${safeAlt}" loading="lazy" class="${cls}"
    onerror="this.outerHTML='<div class=\\'ph ${cls}\\'>ADD IMAGE<br>${src}</div>'">`;
}

function isVideoPath(src){
  return /\.(mp4|mov|webm|ogg)(\?.*)?$/i.test(String(src || ""));
}

function mediaHTML(src, alt, cls=""){
  if(!src) return `<div class="ph ${cls}">No image yet</div>`;
  if(isVideoPath(src)){
    return `<video src="${src}" controls playsinline muted preload="metadata" class="${cls}" style="width:100%; height:100%; object-fit:cover; display:block; background:#000;"></video>`;
  }
  return img(src, alt, cls);
}

}

function parseHash(){
  const h = (location.hash||"").replace(/^#\/?/,"");
  if(!h) return { page:"home" };
  const bits = h.split("/").filter(Boolean);
  if(bits[0]==="projects" && bits[1]) return { page:"project", slug:bits[1] };
  if(bits[0]==="about" || bits[0]==="contact") return { page:"home", section:bits[0] };
  if(bits[0]==="home") return { page:"home", section:["about","contact"].includes(bits[1]) ? bits[1] : null };
  const known = ROUTES.find(r=>r.id===bits[0]);
  return { page: known ? known.id : "home" };
}

function render(){
  const r = parseHash();
  let html, active = r.page;
  switch(r.page){
    case "project":    html = pageProject(r.slug); active="projects"; break;
    case "projects":   html = pageProjects();   break;
    case "experience": html = pageExperience(); break;
    default:           html = pageHome();       active="home";
  }
  view.innerHTML = html;
  buildNav(active);
  $("#nav").classList.remove("open");
  $("#menuBtn").setAttribute("aria-expanded","false");
  document.title = (r.page==="project" && findProject(r.slug))
    ? findProject(r.slug).title + " — " + SITE.name
    : SITE.name + " — " + SITE.role;
  window.scrollTo({ top:0, behavior:"instant" in window ? "auto" : "auto" });
  observeRises();
  if(r.section){
    const section = document.getElementById(r.section);
    if(section){ section.scrollIntoView({behavior:"instant", block:"start"}); section.focus({preventScroll:true}); }
  }
}

function go(target){
  if(location.hash === "#/"+target || (target==="home" && !location.hash)){ render(); return; }
  location.hash = "#/"+target;
}

document.addEventListener("click", e=>{
  const card = e.target.closest("[data-project]");
  if(card){ e.preventDefault(); location.hash = "#/projects/"+card.dataset.project; return; }
  const link = e.target.closest("[data-go]");
  if(link){ e.preventDefault(); go(link.dataset.go); return; }
  const shot = e.target.closest("[data-shot]");
  if(shot){ openLightbox(shot.dataset.slug, +shot.dataset.shot); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" || e.key===" "){
    const shot = e.target.closest && e.target.closest("[data-shot]");
    if(shot){ e.preventDefault(); openLightbox(shot.dataset.slug, +shot.dataset.shot); }
  }
});

$("#menuBtn").addEventListener("click", ()=>{
  const nav = $("#nav"), open = nav.classList.toggle("open");
  $("#menuBtn").setAttribute("aria-expanded", String(open));
});

window.addEventListener("hashchange", render);

/* -------------------------------- lightbox ---------------------- */
let lastFocus = null;
function openLightbox(slug, i){
  const p = findProject(slug); if(!p||!p.gallery||!p.gallery[i]) return;
  const g = p.gallery[i];
  lastFocus = document.activeElement;
  $("#lbImg").src = g.src;
  $("#lbImg").alt = g.caption || p.title;
  $("#lbCap").textContent = g.caption || "";
  $("#lightbox").hidden = false;
  $("#lbClose").focus();
}
function closeLightbox(){
  $("#lightbox").hidden = true;
  if(lastFocus) lastFocus.focus();
}
$("#lbClose").addEventListener("click", closeLightbox);
$("#lightbox").addEventListener("click", e=>{ if(e.target.id==="lightbox") closeLightbox(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#lightbox").hidden) closeLightbox(); });

/* -------------------------------- reveal on scroll -------------- */
let io;
function observeRises(){
  const els = document.querySelectorAll(".rise");
  if(!("IntersectionObserver" in window)){ els.forEach(el=>el.classList.add("in")); return; }
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>{
    entries.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  },{ rootMargin:"0px 0px -8% 0px", threshold:.06 });
  els.forEach(el=>io.observe(el));
}

/* -------------------------------- boot -------------------------- */
$("#footLeft").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
render();
</script>
</body>
